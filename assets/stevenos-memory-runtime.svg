<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#111827"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/></marker><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#e5e7eb}.title{font-size:42px;font-weight:800;fill:#f8fafc}.muted{font-size:18px;fill:#94a3b8}.section{font-size:20px;font-weight:700;fill:#f8fafc}.tiny{font-size:13px;fill:#94a3b8}.box{fill:#0f172a;stroke:#334155;stroke-width:1.4;rx:14}.cyan{stroke:#22d3ee}.violet{stroke:#a78bfa}.green{stroke:#34d399}.amber{stroke:#fbbf24}</style></defs>
  <rect width="1200" height="500" fill="url(#bg)"/><rect width="1200" height="500" fill="url(#grid)" opacity="0.75"/>
  <text x="60" y="72" class="title">knowledge-harness memory runtime</text><text x="62" y="110" class="muted">Keeps the vault as source of truth while giving agents safe execution rails.</text>
  <rect x="80" y="205" width="220" height="120" class="box cyan"/><text x="110" y="248" class="section">Knowledge vault</text><text x="110" y="280" class="tiny">schema · index · compiled pages</text>
  <rect x="380" y="205" width="220" height="120" class="box violet"/><text x="410" y="248" class="section">Harness CLI</text><text x="410" y="280" class="tiny">doctor · prompt · query</text>
  <rect x="680" y="205" width="220" height="120" class="box green"/><text x="710" y="248" class="section">Agent run</text><text x="710" y="280" class="tiny">assembled prompt + dry-run rails</text>
  <rect x="970" y="205" width="170" height="120" class="box amber"/><text x="1000" y="248" class="section">Output</text><text x="1000" y="280" class="tiny">verified notes / reports</text>
  <path d="M300 265 H372" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 265 H672" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/><path d="M900 265 H962" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="82" y="410" class="muted">This is the memory layer under digital-twin and agent runtimes: context is inspectable, not hidden in chat history.</text>
</svg>
