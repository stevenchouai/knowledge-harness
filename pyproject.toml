[project]
name = "knowledge-harness"
version = "0.1.0"
description = "A local harness repo that routes Codex runs through Steven's knowledge base."
requires-python = ">=3.11"

[project.scripts]
knowledge-harness = "knowledge_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
